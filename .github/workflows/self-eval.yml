name: Harness self-evaluation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run static/reference suite
        run: python tests/run.py
      - name: Check patch whitespace
        run: git diff --check
